[package]
name = "pixelbomber"
version = "1.2.4"
edition = "2021"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/fabi321/pixelbomber"
description = "Insanely fast pixelflut client for images and animations"
keywords = ["pixelflut", "pixelbomber"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rscam", "env_logger", "image/default", "clap", "sysinfo"]

[dependencies]
image = { version = "0.25", default-features = false }
rand = "0.10"
bufstream = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
sysinfo = { version = "0.40", optional = true }
rscam = { version = "0.5", optional = true }
log = "0.4"
url = "2.5"
env_logger = { version = "0.11.11", optional = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
zstd = "0.14"
nix =  { version = "0.31", features = ["socket"] }
socket2 = "0.6"

[lib]
name = "pixelbomber"
path = "src/lib.rs"

[[bin]]
name = "pixelbomber"
path = "src/main.rs"
required-features = ["default"]

[[example]]
name = "bouncy_ball"
